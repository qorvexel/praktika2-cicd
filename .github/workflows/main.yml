name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Run tests
        run: python -m unittest discover -v

  documentation:
    name: Documentation
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Generate documentation
        run: python -m pydoc -w calculator

      - name: Save documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: calculator.html
          if-no-files-found: error
